name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:
    # Called by release.yml before a tag is published.
    workflow_call:

jobs:
    audit:
        name: Composer audit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer

            - name: Run composer audit
              run: composer audit --locked --no-dev --abandoned=report

    php:
        name: PHP lint and tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer
                  extensions: gd

            - name: Check that GD reads JPEG and writes WebP
              run: |
                  php -r 'exit(imagetypes() & IMG_WEBP && imagetypes() & IMG_JPG ? 0 : 1);'

            - name: Cache composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Run PHPCS
              run: vendor/bin/phpcs

            - name: Run PHPStan
              if: always()
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

            - name: Run PHPUnit
              if: always()
              run: vendor/bin/phpunit

    assets:
        name: Front-end libraries (pnpm)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '26'

            - name: Install pnpm
              run: npm install --global --no-fund --no-audit pnpm@12.22.0

            - name: Install and build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm build
                  test -s public/assets/vendor/leaflet/leaflet.js
                  test -s public/assets/vendor/leaflet/leaflet.css

            - name: Audit the front-end libraries
              run: pnpm audit --prod

            - name: Unit tests of the browser scripts (Vitest)
              run: pnpm test

    e2e:
        name: E2E tests (Playwright)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer
                  extensions: gd

            - name: Check that GD reads JPEG and writes WebP
              run: |
                  php -r 'exit(imagetypes() & IMG_WEBP && imagetypes() & IMG_JPG ? 0 : 1);'

            - name: Cache composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            # With the dev dependencies: bin/demo-data.php writes the demo family from tests/Support.
            - name: Install composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '26'

            - name: Install pnpm
              run: npm install --global --no-fund --no-audit pnpm@12.22.0

            - name: Install and build the front-end libraries
              run: |
                  pnpm install --frozen-lockfile
                  pnpm build

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Run the end-to-end tests
              run: pnpm test:e2e

            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      var/e2e-report
                      var/e2e-results
                  retention-days: 7

    client:
        name: Sync client (Python ${{ matrix.python }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 5
        strategy:
            # A failure on one Python version must not cancel the others.
            fail-fast: false
            matrix:
                python: ['3.10', '3.x']
                os: [ubuntu-latest]
                include:
                    # 3.9 is the oldest version bin/rodokmen-sync supports (users run it with their own Python);
                    # actions/setup-python provides it only up to Ubuntu 24.04.
                    - python: '3.9'
                      os: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python }}

            - name: Run the client tests
              run: python -W error::ResourceWarning -m unittest discover -s tests/client -v
