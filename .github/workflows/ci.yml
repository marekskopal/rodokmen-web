name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

jobs:
    audit:
        name: Composer audit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer

            - name: Run composer audit
              run: composer audit --locked --no-dev --abandoned=report

    php:
        name: PHP lint and tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer

            - name: Cache composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Run PHPCS
              run: vendor/bin/phpcs

            - name: Run PHPStan
              if: always()
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

            - name: Run PHPUnit
              if: always()
              run: vendor/bin/phpunit

    client:
        name: Sync client (Python ${{ matrix.python }})
        runs-on: ubuntu-latest
        timeout-minutes: 5
        strategy:
            matrix:
                python: ['3.10', '3.x']
        steps:
            - uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python }}

            - name: Run the client tests
              run: python -W error::ResourceWarning -m unittest discover -s tests/client -v
