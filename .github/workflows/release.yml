name: Docker image and release

# Pull requests only build the image (as a check that the Dockerfile works). A tag v1.2.3 builds it for amd64 and
# arm64, pushes it to the GitHub Container Registry as 1.2.3, 1.2, 1 and latest, and creates the GitHub release with
# the notes from CHANGELOG.md and bin/rodokmen-sync attached – but only after the checks of ci.yml pass for the tag.
on:
    push:
        tags: ['v*.*.*']
    pull_request:
        paths:
            - Dockerfile
            - .dockerignore
            - composer.json
            - composer.lock
            - package.json
            - pnpm-lock.yaml
            - bin/build-assets.mjs
            - .github/workflows/release.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    checks:
        name: Checks
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/workflows/ci.yml

    image:
        name: Docker image
        needs: checks
        # Pull requests and manual runs skip the checks (ci.yml runs them there on its own).
        if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            - name: Set up QEMU (arm64)
              uses: docker/setup-qemu-action@v4

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the GitHub Container Registry
              if: startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tags and labels
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=ref,event=pr
                  labels: |
                      org.opencontainers.image.title=rodokmen-web
                      org.opencontainers.image.description=Private family tree website for projects made with the rodokmen Claude Code skill
                      org.opencontainers.image.licenses=MIT

            - name: Build (and push a release)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: ${{ startsWith(github.ref, 'refs/tags/v') }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  provenance: mode=max
                  sbom: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    release:
        name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: image
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - name: Release notes from CHANGELOG.md
              env:
                  VERSION: ${{ github.ref_name }}
              run: |
                  version="${VERSION#v}"
                  # The section "## [1.2.3] …" up to the next "## [" heading.
                  awk -v v="$version" '
                      /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
                      found && !/^\[[^]]+\]: / { print }
                  ' CHANGELOG.md > release-notes.md
                  if [ ! -s release-notes.md ]; then
                      echo "CHANGELOG.md has no section for $version" >&2
                      exit 1
                  fi

            - name: Create the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  # A pre-release tag (v1.2.0-rc.1) must not become the "latest" release the README downloads from.
                  prerelease=()
                  case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
                  gh release create "$TAG" bin/rodokmen-sync --title "rodokmen-web ${TAG#v}" \
                      --notes-file release-notes.md --verify-tag "${prerelease[@]}"
