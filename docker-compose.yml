services:
  rodokmen:
    build: .
    image: rodokmen-site:latest
    restart: unless-stopped
    env_file: .env
    # SITE_TRUSTED_PROXIES defaults to "private" in the image (a proxy on the host or in another container);
    # set it in .env when the proxy is elsewhere.
    ports:
      # Behind a reverse proxy (TLS terminated there); change the host port as needed.
      - "127.0.0.1:8080:80"
    volumes:
      # Data (var/data, releases of the sync API) and cache. Upload the data with bin/rodokmen-sync,
      # either to the API (SITE_SYNC_TOKEN) or with rsync into ./var/data – no restart is needed.
      - ./var:/var/www/site/var
      # Logs: Tracy's error.log, warning.log, info.log and exception reports, php-error.log for errors
      # before Tracy starts. Apache's own logs and a copy of every record are in docker compose logs.
      - ./log:/var/www/site/log
